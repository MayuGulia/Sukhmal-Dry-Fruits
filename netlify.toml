[build]
  base = "frontend"
  command = "npm run build"
  publish = "build"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/admin/ai-inventory/preview"
  to = "/.netlify/functions/ai-inventory"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/ai-inventory/apply"
  to = "/.netlify/functions/ai-inventory"
  status = 200
  force = true

[[redirects]]
  from = "/api/ai-chat"
  to = "/.netlify/functions/ai-chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
